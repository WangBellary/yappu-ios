 stow your bag in the overhead bin.","exampleZh":"请把包放入头顶行李舱。"},{"id":"w:overhead","lemma":"overhead","pos":"adj.","ipa":"/ˌəʊvəˈhed/","zh":"头顶上方的","emoji":"","example":"Put small bags in the overhead bin.","exampleZh":"把小包放在头顶行李舱里。"},{"id":"w:bin","lemma":"bin","pos":"n.","ipa":"/bɪn/","zh":"行李舱；箱","emoji":"","example":"This bin is full, so keep your bag under the seat.","exampleZh":"这个行李舱满了，请把包放在座位下面。"},{"id":"w:gate","lemma":"gate","pos":"n.","ipa":"/ɡeɪt/","zh":"登机口","emoji":"","example":"The gate closes twenty minutes before departure.","exampleZh":"登机口在起飞前二十分钟关闭。"},{"id":"w:luggage","lemma":"luggage","pos":"n.","ipa":"/ˈlʌɡɪdʒ/","zh":"行李","emoji":"","example":"Your luggage will be checked to the final stop.","exampleZh":"您的行李将被托运到最终目的地。"},{"id":"w:board","lemma":"board","pos":"v.","ipa":"/bɔːd/","zh":"登机；上飞机","emoji":"","example":"Passengers board the aircraft through gate twelve.","exampleZh":"旅客通过十二号登机口登机。"},{"id":"w:ticket","lemma":"ticket","pos":"n.","ipa":"/ˈtɪkɪt/","zh":"机票；票","emoji":"","example":"Please show your ticket and passport at the gate.","exampleZh":"请在登机口出示机票和护照。"},{"id":"w:passport","lemma":"passport","pos":"n.","ipa":"/ˈpɑːspɔːt/","zh":"护照","emoji":"","example":"Please keep your passport in a safe place.","exampleZh":"请把护照放在安全的地方。"},{"id":"w:queue","lemma":"queue","pos":"n.","ipa":"/kjuː/","zh":"队列；队伍","emoji":"","example":"A long queue formed at the boarding gate.","exampleZh":"登机口前排起了长队。"},{"id":"w:row","lemma":"row","pos":"n.","ipa":"/rəʊ/","zh":"排；行","emoji":"","example":"Your seat is in row eighteen, near the window.","exampleZh":"您的座位在十八排，靠窗。"},{"id":"w:locate","lemma":"locate","pos":"v.","ipa":"/ləʊˈkeɪt/","zh":"找到；确定位置","emoji":"","example":"Let me help you locate your seat.","exampleZh":"让我帮您找到座位。"},{"id":"w:welcome","lemma":"welcome","pos":"v.","ipa":"/ˈwelkəm/","zh":"欢迎","emoji":"","example":"We welcome you aboard our flight today.","exampleZh":"欢迎您今天乘坐我们的航班。"},{"id":"w:assistance","lemma":"assistance","pos":"n.","ipa":"/əˈsɪstəns/","zh":"帮助；协助","emoji":"","example":"Please ask the crew for any assistance.","exampleZh":"如需任何帮助，请询问机组人员。"},{"id":"w:seatbelt","lemma":"seatbelt","pos":"n.","ipa":"/ˈsiːtbelt/","zh":"安全带","emoji":"","example":"Please fasten your seatbelt before the aircraft moves.","exampleZh":"飞机移动前请系好安全带。"},{"id":"w:buckle","lemma":"buckle","pos":"v.","ipa":"/ˈbʌkəl/","zh":"扣上；扣紧","emoji":"","example":"Please buckle the belt low across your hips.","exampleZh":"请把安全带低低地扣在胯部。"},{"id":"w:fasten","lemma":"fasten","pos":"v.","ipa":"/ˈfɑːsən/","zh":"系紧；扣牢","emoji":"","example":"Please fasten your seatbelt when the sign is on.","exampleZh":"安全带指示灯亮起时请系好安全带。"},{"id":"w:upright","lemma":"upright","pos":"adj.","ipa":"/ˈʌpraɪt/","zh":"竖直的；直立的","emoji":"","example":"Keep your seat upright for takeoff and landing.","exampleZh":"起飞和降落时请调直座椅靠背。"},{"id":"w:tray","lemma":"tray","pos":"n.","ipa":"/treɪ/","zh":"托盘；小桌板","emoji":"","example":"Please put your tray table away now.","exampleZh":"请现在收起小桌板。"},{"id":"w:fold","lemma":"fold","pos":"v.","ipa":"/fəʊld/","zh":"折叠；收起","emoji":"","example":"Please fold the tray table before landing.","exampleZh":"降落前请收起小桌板。"},{"id":"w:mask","lemma":"mask","pos":"n.","ipa":"/mɑːsk/","zh":"面罩；口罩","emoji":"","example":"Pull the mask down over your nose and mouth.","exampleZh":"把面罩向下拉到鼻子和嘴巴上。"},{"id":"w:oxygen","lemma":"oxygen","pos":"n.","ipa":"/ˈɒksɪdʒən/","zh":"氧气","emoji":"","example":"The oxygen masks will drop from the ceiling.","exampleZh":"氧气面罩会从头顶落下。"},{"id":"w:vest","lemma":"vest","pos":"n.","ipa":"/vest/","zh":"背心；救生衣","emoji":"","example":"Your life vest is under the seat.","exampleZh":"您的救生衣在座位下方。"},{"id":"w:exit","lemma":"exit","pos":"n.","ipa":"/ˈeksɪt/","zh":"出口","emoji":"","example":"The nearest exit is behind you on the left.","exampleZh":"最近的出口在您身后左侧。"},{"id":"w:demonstration","lemma":"demonstration","pos":"n.","ipa":"/ˌdemənˈstreɪʃən/","zh":"演示；示范","emoji":"","example":"Please watch the safety demonstration on the screen.","exampleZh":"请观看屏幕上的安全演示。"},{"id":"w:instruction","lemma":"instruction","pos":"n.","ipa":"/ɪnˈstrʌkʃən/","zh":"指示；说明","emoji":"","example":"Please follow every safety instruction carefully.","exampleZh":"请认真遵守每一条安全指示。"},{"id":"w:comply","lemma":"comply","pos":"v.","ipa":"/kəmˈplaɪ/","zh":"遵守；服从","emoji":"","example":"All passengers must comply with safety rules.","exampleZh":"所有旅客都必须遵守安全规定。"},{"id":"w:electronic","lemma":"electronic","pos":"adj.","ipa":"/ɪˌlekˈtrɒnɪk/","zh":"电子的","emoji":"","example":"Switch off all electronic devices before takeoff.","exampleZh":"起飞前请关闭所有电子设备。"},{"id":"w:device","lemma":"device","pos":"n.","ipa":"/dɪˈvaɪs/","zh":"设备；装置","emoji":"","example":"Put every electronic device in flight mode.","exampleZh":"请把每件电子设备调至飞行模式。"},{"id":"w:mode","lemma":"mode","pos":"n.","ipa":"/məʊd/","zh":"模式","emoji":"","example":"Set your phone to flight mode now.","exampleZh":"请现在把手机调到飞行模式。"},{"id":"w:smoke","lemma":"smoke","pos":"v.","ipa":"/sməʊk/","zh":"吸烟","emoji":"","example":"Do not smoke anywhere in the cabin.","exampleZh":"请勿在客舱任何地方吸烟。"},{"id":"w:lavatory","lemma":"lavatory","pos":"n.","ipa":"/ˈlævətri/","zh":"洗手间；盥洗室","emoji":"","example":"The lavatory at the rear is now free.","exampleZh":"后舱的洗手间现在空出来了。"},{"id":"w:safety","lemma":"safety","pos":"n.","ipa":"/ˈseɪfti/","zh":"安全","emoji":"","example":"Your safety is our first priority on every flight.","exampleZh":"您的安全是我们每次航班的头等大事。"},{"id":"w:briefing","lemma":"briefing","pos":"n.","ipa":"/ˈbriːfɪŋ/","zh":"讲解；简报","emoji":"","example":"The safety briefing begins before the doors close.","exampleZh":"安全讲解在舱门关闭前开始。"},{"id":"w:meal","lemma":"meal","pos":"n.","ipa":"/miːl/","zh":"餐；一餐","emoji":"","example":"Would you like a meal on this flight?","exampleZh":"本次航班您需要用餐吗？"},{"id":"w:beverage","lemma":"beverage","pos":"n.","ipa":"/ˈbevərɪdʒ/","zh":"饮料","emoji":"","example":"May I offer you a cold beverage?","exampleZh":"给您来一杯冷饮好吗？"},{"id":"w:cart","lemma":"cart","pos":"n.","ipa":"/kɑːt/","zh":"推车；餐车","emoji":"","example":"The cart is coming down the aisle now.","exampleZh":"餐车现在正沿着过道推过来。"},{"id":"w:option","lemma":"option","pos":"n.","ipa":"/ˈɒpʃən/","zh":"选择；选项","emoji":"","example":"Your meal option includes rice or noodles.","exampleZh":"您的餐食可选米饭或面条。"},{"id":"w:chicken","lemma":"chicken","pos":"n.","ipa":"/ˈtʃɪkɪn/","zh":"鸡肉","emoji":"","example":"The chicken with rice is very popular today.","exampleZh":"今天的鸡肉配米饭很受欢迎。"},{"id":"w:beef","lemma":"beef","pos":"n.","ipa":"/biːf/","zh":"牛肉","emoji":"","example":"We also have beef with potatoes.","exampleZh":"我们还有牛肉配土豆。"},{"id":"w:rice","lemma":"rice","pos":"n.","ipa":"/raɪs/","zh":"米饭；大米","emoji":"","example":"Would you like rice or noodles with the fish?","exampleZh":"您要米饭还是面条配鱼？"},{"id":"w:noodle","lemma":"noodle","pos":"n.","ipa":"/ˈnuːdəl/","zh":"面条","emoji":"","example":"The noodle dish is served with a small salad.","exampleZh":"这道面食配一小份沙拉。"},{"id":"w:coffee","lemma":"coffee","pos":"n.","ipa":"/ˈkɒfi/","zh":"咖啡","emoji":"","example":"Would you like coffee or tea after your meal?","exampleZh":"餐后您要咖啡还是茶？"},{"id":"w:tea","lemma":"tea","pos":"n.","ipa":"/tiː/","zh":"茶","emoji":"","example":"I will bring your tea in a moment.","exampleZh":"我马上给您送茶来。"},{"id":"w:juice","lemma":"juice","pos":"n.","ipa":"/dʒuːs/","zh":"果汁","emoji":"","example":"We have orange juice and apple juice.","exampleZh":"我们有橙汁和苹果汁。"},{"id":"w:ice","lemma":"ice","pos":"n.","ipa":"/aɪs/","zh":"冰","emoji":"","example":"Would you like ice with your juice?","exampleZh":"您的果汁要加冰吗？"},{"id":"w:sugar","lemma":"sugar","pos":"n.","ipa":"/ˈʃʊɡə/","zh":"糖","emoji":"","example":"Do you take sugar in your coffee?","exampleZh":"您的咖啡要加糖吗？"},{"id":"w:refill","lemma":"refill","pos":"v.","ipa":"/ˌriːˈfɪl/","zh":"续杯；重新装满","emoji":"","example":"I can refill your cup if you like.","exampleZh":"如果您愿意，我可以给您续杯。"},{"id":"w:napkin","lemma":"napkin","pos":"n.","ipa":"/ˈnæpkɪn/","zh":"餐巾","emoji":"","example":"Here is a napkin for your meal.","exampleZh":"这是给您用餐的餐巾。"},{"id":"w:cutlery","lemma":"cutlery","pos":"n.","ipa":"/ˈkʌtləri/","zh":"餐具","emoji":"","example":"The cutlery is in the drawer of the cart.","exampleZh":"餐具在餐车的抽屉里。"},{"id":"w:vegetarian","lemma":"vegetarian","pos":"adj.","ipa":"/ˌvedʒəˈteəriən/","zh":"素食的","emoji":"","example":"We have a vegetarian meal for you.","exampleZh":"我们为您准备了素食餐。"},{"id":"w:allergy","lemma":"allergy","pos":"n.","ipa":"/ˈælədʒi/","zh":"过敏","emoji":"","example":"Do you have any food allergy we should know?","exampleZh":"您有我们需要了解的食物过敏吗？"},{"id":"w:serve","lemma":"serve","pos":"v.","ipa":"/sɜːv/","zh":"提供；端上","emoji":"","example":"We will serve drinks after the seatbelt sign goes off.","exampleZh":"安全带指示灯熄灭后我们会提供饮品。"},{"id":"w:galley","lemma":"galley","pos":"n.","ipa":"/ˈɡæli/","zh":"机上厨房","emoji":"","example":"The galley is at the rear of the cabin.","exampleZh":"机上厨房在客舱后部。"},{"id":"w:wheelchair","lemma":"wheelchair","pos":"n.","ipa":"/ˈwiːltʃeə/","zh":"轮椅","emoji":"","example":"A wheelchair is waiting at the arrival gate.","exampleZh":"到达登机口处有一辆轮椅在等候。"},{"id":"w:unaccompanied","lemma":"unaccompanied","pos":"adj.","ipa":"/ˌʌnəˈkʌmpənid/","zh":"无人陪伴的","emoji":"","example":"The unaccompanied child wears a special badge.","exampleZh":"无人陪伴的儿童佩戴一枚特殊徽章。"},{"id":"w:minor","lemma":"minor","pos":"n.","ipa":"/ˈmaɪnə/","zh":"未成年人","emoji":"","example":"An unaccompanied minor needs extra care on board.","exampleZh":"无人陪伴的未成年人需要在机上特别照顾。"},{"id":"w:infant","lemma":"infant","pos":"n.","ipa":"/ˈɪnfənt/","zh":"婴儿","emoji":"","example":"The infant must sit on an adult lap.","exampleZh":"婴儿必须由成人抱着坐。"},{"id":"w:pregnant","lemma":"pregnant","pos":"adj.","ipa":"/ˈpreɡnənt/","zh":"怀孕的","emoji":"","example":"A pregnant passenger should ask for extra help.","exampleZh":"怀孕的旅客应主动寻求额外帮助。"},{"id":"w:elderly","lemma":"elderly","pos":"adj.","ipa":"/ˈeldəli/","zh":"年长的","emoji":"","example":"Please offer elderly passengers a hand with bags.","exampleZh":"请主动帮年长旅客拿行李。"},{"id":"w:disabled","lemma":"disabled","pos":"adj.","ipa":"/dɪsˈeɪbəld/","zh":"残疾的","emoji":"","example":"A disabled passenger can pre-book a wheelchair.","exampleZh":"残疾旅客可以提前预订轮椅。"},{"id":"w:escort","lemma":"escort","pos":"v.","ipa":"/ɪˈskɔːt/","zh":"护送；陪同","emoji":"","example":"A crew member will escort the child to the gate.","exampleZh":"一名机组人员会陪送孩子到登机口。"},{"id":"w:stroller","lemma":"stroller","pos":"n.","ipa":"/ˈstrəʊlə/","zh":"婴儿车","emoji":"","example":"You can check the stroller at the aircraft door.","exampleZh":"您可以在机舱门口托运婴儿车。"},{"id":"w:accompany","lemma":"accompany","pos":"v.","ipa":"/əˈkʌmpəni/","zh":"陪伴；陪同","emoji":"","example":"A parent must accompany every infant on board.","exampleZh":"每位婴儿登机都必须由家长陪同。"},{"id":"w:priority","lemma":"priority","pos":"n.","ipa":"/praɪˈɒrəti/","zh":"优先；优先权","emoji":"","example":"Boarding priority is given to passengers with children.","exampleZh":"带孩子的旅客优先登机。"},{"id":"w:special","lemma":"special","pos":"adj.","ipa":"/ˈspeʃəl/","zh":"特殊的","emoji":"","example":"We offer special help to elderly passengers.","exampleZh":"我们为年长旅客提供特别帮助。"},{"id":"w:request","lemma":"request","pos":"n.","ipa":"/rɪˈkwest/","zh":"请求；要求","emoji":"","example":"We will try to meet every special request.","exampleZh":"我们会尽量满足每一个特殊请求。"},{"id":"w:service","lemma":"service","pos":"n.","ipa":"/ˈsɜːvɪs/","zh":"服务","emoji":"","example":"Cabin service starts shortly after takeoff.","exampleZh":"客舱服务在起飞后不久开始。"},{"id":"w:deaf","lemma":"deaf","pos":"adj.","ipa":"/def/","zh":"失聪的","emoji":"","example":"A deaf passenger may need written instructions.","exampleZh":"失聪的旅客可能需要书面说明。"},{"id":"w:braille","lemma":"braille","pos":"n.","ipa":"/breɪl/","zh":"盲文","emoji":"","example":"The safety card is available in braille.","exampleZh":"安全须知卡有盲文版本。"},{"id":"w:guide","lemma":"guide","pos":"v.","ipa":"/ɡaɪd/","zh":"引导；指引","emoji":"","example":"The crew will guide you to the nearest exit.","exampleZh":"机组人员会引导您到最近的出口。"},{"id":"w:patience","lemma":"patience","pos":"n.","ipa":"/ˈpeɪʃəns/","zh":"耐心","emoji":"","example":"Thank you for your patience during the delay.","exampleZh":"感谢您在延误期间的耐心等待。"},{"id":"w:comfortable","lemma":"comfortable","pos":"adj.","ipa":"/ˈkʌmftəbəl/","zh":"舒适的","emoji":"","example":"Please tell me if your seat is not comfortable.","exampleZh":"如果您的座位不舒服，请告诉我。"},{"id":"w:armrest","lemma":"armrest","pos":"n.","ipa":"/ˈɑːmrest/","zh":"扶手","emoji":"","example":"Keep your armrest down during the meal service.","exampleZh":"用餐服务期间请放下扶手。"},{"id":"w:medical","lemma":"medical","pos":"adj.","ipa":"/ˈmedɪkəl/","zh":"医疗的；医学的","emoji":"","example":"Please call for medical help immediately.","exampleZh":"请立即呼叫医疗救助。"},{"id":"w:emergency","lemma":"emergency","pos":"n.","ipa":"/ɪˈmɜːdʒənsi/","zh":"紧急情况","emoji":"","example":"The crew is trained for any medical emergency.","exampleZh":"机组人员受过应对任何医疗紧急情况的训练。"},{"id":"w:aid","lemma":"aid","pos":"n.","ipa":"/eɪd/","zh":"救助；援助","emoji":"","example":"The crew gave first aid to the sick passenger.","exampleZh":"机组人员对生病的旅客进行了急救。"},{"id":"w:faint","lemma":"faint","pos":"v.","ipa":"/feɪnt/","zh":"晕倒","emoji":"","example":"A passenger may faint during a long flight.","exampleZh":"长途飞行中旅客可能会晕倒。"},{"id":"w:dizzy","lemma":"dizzy","pos":"adj.","ipa":"/ˈdɪzi/","zh":"头晕的","emoji":"","example":"She feels dizzy and needs some water.","exampleZh":"她感到头晕，需要喝点水。"},{"id":"w:nausea","lemma":"nausea","pos":"n.","ipa":"/ˈnɔːziə/","zh":"恶心","emoji":"","example":"He has nausea and a bad headache.","exampleZh":"他感到恶心，还伴有严重头痛。"},{"id":"w:fever","lemma":"fever","pos":"n.","ipa":"/ˈfiːvə/","zh":"发烧；发热","emoji":"","example":"The child has a high fever now.","exampleZh":"这个孩子现在发高烧。"},{"id":"w:pulse","lemma":"pulse","pos":"n.","ipa":"/pʌls/","zh":"脉搏","emoji":"","example":"The nurse checks his pulse every ten minutes.","exampleZh":"护士每十分钟检查一次他的脉搏。"},{"id":"w:breathe","lemma":"breathe","pos":"v.","ipa":"/briːð/","zh":"呼吸","emoji":"","example":"Please breathe slowly and stay calm.","exampleZh":"请慢慢呼吸，保持冷静。"},{"id":"w:unconscious","lemma":"unconscious","pos":"adj.","ipa":"/ʌnˈkɒnʃəs/","zh":"昏迷的；失去意识的","emoji":"","example":"The passenger became unconscious after the meal.","exampleZh":"这位旅客用餐后失去了意识。"},{"id":"w:injury","lemma":"injury","pos":"n.","ipa":"/ˈɪndʒəri/","zh":"伤；受伤","emoji":"","example":"Wash the small injury with clean water.","exampleZh":"用清水清洗这个小伤口。"},{"id":"w:bleed","lemma":"bleed","pos":"v.","ipa":"/bliːd/","zh":"流血","emoji":"","example":"The cut may bleed for a short time.","exampleZh":"这个伤口可能会流一会儿血。"},{"id":"w:bandage","lemma":"bandage","pos":"n.","ipa":"/ˈbændɪdʒ/","zh":"绷带","emoji":"","example":"Put a clean bandage on the wound.","exampleZh":"在伤口上包一块干净的绷带。"},{"id":"w:medication","lemma":"medication","pos":"n.","ipa":"/ˌmedɪˈkeɪʃən/","zh":"药物；用药","emoji":"","example":"Does the passenger take any medication daily?","exampleZh":"这位旅客每天服药吗？"},{"id":"w:doctor","lemma":"doctor","pos":"n.","ipa":"/ˈdɒktə/","zh":"医生","emoji":"","example":"A doctor on board offered to help.","exampleZh":"机上一位医生主动提供帮助。"},{"id":"w:nurse","lemma":"nurse","pos":"n.","ipa":"/nɜːs/","zh":"护士","emoji":"","example":"The nurse checked the blood pressure again.","exampleZh":"护士又检查了一次血压。"},{"id":"w:defibrillator","lemma":"defibrillator","pos":"n.","ipa":"/diːˈfɪbrɪleɪtə/","zh":"除颤器","emoji":"","example":"The defibrillator is stored in the overhead bin.","exampleZh":"除颤器存放在头顶行李舱里。"},{"id":"w:symptom","lemma":"symptom","pos":"n.","ipa":"/ˈsɪmptəm/","zh":"症状","emoji":"","example":"Tell me your main symptom right now.","exampleZh":"请告诉我您现在最主要的症状。"},{"id":"w:treat","lemma":"treat","pos":"v.","ipa":"/triːt/","zh":"治疗；处理","emoji":"","example":"The nurse will treat the minor injury on board.","exampleZh":"护士会在机上处理这个小伤口。"},{"id":"w:kit","lemma":"kit","pos":"n.","ipa":"/kɪt/","zh":"急救包；工具包","emoji":"","example":"The medical kit is kept in the aft galley.","exampleZh":"急救包存放在后舱厨房。"},{"id":"w:delay","lemma":"delay","pos":"v.","ipa":"/dɪˈleɪ/","zh":"延误；推迟","emoji":"","example":"Heavy snow may delay our flight tonight.","exampleZh":"大雪可能会使我们的航班今晚延误。"},{"id":"w:cancel","lemma":"cancel","pos":"v.","ipa":"/ˈkænsəl/","zh":"取消","emoji":"","example":"They may cancel the flight because of fog.","exampleZh":"他们可能因大雾取消航班。"},{"id":"w:weather","lemma":"weather","pos":"n.","ipa":"/ˈweðə/","zh":"天气","emoji":"","example":"Bad weather is affecting many flights today.","exampleZh":"恶劣天气正在影响今天的许多航班。"},{"id":"w:postpone","lemma":"postpone","pos":"v.","ipa":"/pəˈspəʊn/","zh":"推迟；延期","emoji":"","example":"We must postpone the departure by two hours.","exampleZh":"我们必须把起飞时间推迟两小时。"},{"id":"w:reschedule","lemma":"reschedule","pos":"v.","ipa":"/ˌriːˈʃedjuːl/","zh":"更改时间；改签","emoji":"","example":"We can reschedule your flight for tomorrow morning.","exampleZh":"我们可以把您的航班改到明天上午。"},{"id":"w:rebook","lemma":"rebook","pos":"v.","ipa":"/ˌriːˈbʊk/","zh":"重新订票；改签","emoji":"","example":"I can rebook you on the next flight.","exampleZh":"我可以帮您改签到下一班航班。"},{"id":"w:connection","lemma":"connection","pos":"n.","ipa":"/kəˈnekʃən/","zh":"转机；衔接","emoji":"","example":"You will miss your connection in Shanghai.","exampleZh":"您会在上海错过转机。"},{"id":"w:transfer","lemma":"transfer","pos":"n.","ipa":"/ˈtrænsfɜː/","zh":"转机；转移","emoji":"","example":"Your transfer is at gate twenty-two.","exampleZh":"您的转机在二十二号登机口。"},{"id":"w:refund","lemma":"refund","pos":"n.","ipa":"/ˈriːfʌnd/","zh":"退款","emoji":"","example":"You can ask for a full refund.","exampleZh":"您可以申请全额退款。"},{"id":"w:voucher","lemma":"voucher","pos":"n.","ipa":"/ˈvaʊtʃə/","zh":"代金券；凭证","emoji":"","example":"Here is a meal voucher for the waiting time.","exampleZh":"这是等候期间使用的餐券。"},{"id":"w:compensation","lemma":"compensation","pos":"n.","ipa":"/ˌkɒmpenˈseɪʃən/","zh":"赔偿；补偿","emoji":"","example":"Passengers may claim compensation for the long delay.","exampleZh":"旅客可以就长时间延误申请赔偿。"},{"id":"w:apologize","lemma":"apologize","pos":"v.","ipa":"/əˈpɒlədʒaɪz/","zh":"道歉","emoji":"","example":"We apologize for the inconvenience this delay caused.","exampleZh":"我们为此次延误造成的不便道歉。"},{"id":"w:announcement","lemma":"announcement","pos":"n.","ipa":"/əˈnaʊnsmənt/","zh":"广播 "id":"w:remain","lemma":"remain","pos":"v.","ipa":"/rɪˈmeɪn/","zh":"保持；停留","emoji":"","example":"Please remain seated until the aircraft stops.","exampleZh":"飞机停稳前请留在座位上。"},{"id":"w:seated","lemma":"seated","pos":"adj.","ipa":"/ˈsiːtɪd/","zh":"坐着的","emoji":"","example":"Keep your children seated during the flight.","exampleZh":"飞行期间请让孩子坐好。"},{"id":"w:turbulence","lemma":"turbulence","pos":"n.","ipa":"/ˈtɜːbjələns/","zh":"颠簸；湍流","emoji":"","example":"We expect light turbulence over the mountains.","exampleZh":"我们预计飞越山区时会有轻度颠簸。"},{"id":"w:forecast","lemma":"forecast","pos":"n.","ipa":"/ˈfɔːkɑːst/","zh":"预报","emoji":"","example":"The weather forecast shows clear skies ahead.","exampleZh":"天气预报显示前方天气晴朗。"},{"id":"w:route","lemma":"route","pos":"n.","ipa":"/ruːt/","zh":"航线；路线","emoji":"","example":"Our route takes us over the Pacific Ocean.","exampleZh":"我们的航线会飞越太平洋。"},{"id":"w:altitude","lemma":"altitude","pos":"n.","ipa":"/ˈæltɪtjuːd/","zh":"高度；海拔","emoji":"","example":"We are flying at an altitude of ten thousand meters.","exampleZh":"我们正在一万米的高度飞行。"},{"id":"w:local","lemma":"local","pos":"adj.","ipa":"/ˈləʊkəl/","zh":"当地的；本地的","emoji":"","example":"The local time in Tokyo is one hour ahead.","exampleZh":"东京当地时间快一小时。"},{"id":"w:temperature","lemma":"temperature","pos":"n.","ipa":"/ˈtemprətʃə/","zh":"温度；气温","emoji":"","example":"The outside temperature is minus forty degrees.","exampleZh":"舱外温度是零下四十度。"},{"id":"w:approximately","lemma":"approximately","pos":"adv.","ipa":"/əˈprɒksɪmətli/","zh":"大约；大概","emoji":"","example":"We will land in approximately twenty minutes.","exampleZh":"我们大约二十分钟后降落。"},{"id":"w:moment","lemma":"moment","pos":"n.","ipa":"/ˈməʊmənt/","zh":"片刻；瞬间","emoji":"","example":"We will begin boarding in a moment.","exampleZh":"我们马上开始登机。"},{"id":"w:shortly","lemma":"shortly","pos":"adv.","ipa":"/ˈʃɔːtli/","zh":"不久；很快","emoji":"","example":"The captain will speak to you shortly.","exampleZh":"机长很快会向大家讲话。"},{"id":"w:flight","lemma":"flight","pos":"n.","ipa":"/flaɪt/","zh":"航班；飞行","emoji":"","example":"This flight will arrive on time today.","exampleZh":"今天的这个航班将准点到达。"},{"id":"w:cruise","lemma":"cruise","pos":"v.","ipa":"/kruːz/","zh":"巡航","emoji":"","example":"We will cruise at thirty thousand feet.","exampleZh":"我们将在三万英尺高度巡航。"},{"id":"w:evacuation","lemma":"evacuation","pos":"n.","ipa":"/ɪˌvækjuˈeɪʃən/","zh":"撤离；疏散","emoji":"","example":"The crew practiced the evacuation procedure twice.","exampleZh":"机组人员演练了两次撤离程序。"},{"id":"w:evacuate","lemma":"evacuate","pos":"v.","ipa":"/ɪˈvækjuˌeɪt/","zh":"撤离；疏散","emoji":"","example":"We must evacuate the cabin within ninety seconds.","exampleZh":"我们必须在九十秒内撤离客舱。"},{"id":"w:decompression","lemma":"decompression","pos":"n.","ipa":"/ˌdiːkəmˈpreʃən/","zh":"失压；减压","emoji":"","example":"A sudden decompression requires oxygen masks.","exampleZh":"突然失压需要使用氧气面罩。"},{"id":"w:diversion","lemma":"diversion","pos":"n.","ipa":"/daɪˈvɜːʃən/","zh":"备降；改道","emoji":"","example":"The diversion to Kunming added two hours.","exampleZh":"备降昆明多花了两个小时。"},{"id":"w:brace","lemma":"brace","pos":"v.","ipa":"/breɪs/","zh":"支撑；做好防撞姿势","emoji":"","example":"Please brace your feet against the floor.","exampleZh":"请把双脚蹬住地板。"},{"id":"w:impact","lemma":"impact","pos":"n.","ipa":"/ˈɪmpækt/","zh":"撞击；冲击","emoji":"","example":"Hold your head down before the impact.","exampleZh":"撞击前请低下头。"},{"id":"w:slide","lemma":"slide","pos":"n.","ipa":"/slaɪd/","zh":"滑梯","emoji":"","example":"Leave the aircraft using the emergency slide.","exampleZh":"使用应急滑梯离开飞机。"},{"id":"w:raft","lemma":"raft","pos":"n.","ipa":"/rɑːft/","zh":"救生筏","emoji":"","example":"The life raft is beside the rear door.","exampleZh":"救生筏在后舱门旁边。"},{"id":"w:survive","lemma":"survive","pos":"v.","ipa":"/səˈvaɪv/","zh":"幸存；活下来","emoji":"","example":"Most passengers survive when they follow instructions.","exampleZh":"大多数旅客听从指示就能幸存。"},{"id":"w:survival","lemma":"survival","pos":"n.","ipa":"/səˈvaɪvəl/","zh":"生存；幸存","emoji":"","example":"The survival kit is inside the life raft.","exampleZh":"生存包在救生筏里面。"},{"id":"w:fire","lemma":"fire","pos":"n.","ipa":"/ˈfaɪə/","zh":"火；火灾","emoji":"","example":"A small fire started in the rear galley.","exampleZh":"后舱厨房起了一场小火。"},{"id":"w:extinguisher","lemma":"extinguisher","pos":"n.","ipa":"/ɪkˈstɪŋɡwɪʃə/","zh":"灭火器","emoji":"","example":"Use the extinguisher on the burning seat.","exampleZh":"用灭火器扑灭着火的座椅。"},{"id":"w:command","lemma":"command","pos":"n.","ipa":"/kəˈmɑːnd/","zh":"指令；命令","emoji":"","example":"Give the command in a loud clear voice.","exampleZh":"用响亮清楚的声音下达指令。"},{"id":"w:shout","lemma":"shout","pos":"v.","ipa":"/ʃaʊt/","zh":"喊；大声说","emoji":"","example":"You must shout the command very loudly.","exampleZh":"你必须非常大声地喊出指令。"},{"id":"w:jump","lemma":"jump","pos":"v.","ipa":"/dʒʌmp/","zh":"跳；跳跃","emoji":"","example":"You must jump onto the slide with care.","exampleZh":"你必须小心地跳到滑梯上。"},{"id":"w:escape","lemma":"escape","pos":"v.","ipa":"/ɪˈskeɪp/","zh":"逃生；逃离","emoji":"","example":"Passengers must escape through the nearest exit.","exampleZh":"旅客必须从最近的出口逃生。"},{"id":"w:chaos","lemma":"chaos","pos":"n.","ipa":"/ˈkeɪɒs/","zh":"混乱","emoji":"","example":"Good briefings prevent chaos during an evacuation.","exampleZh":"充分的讲解能避免撤离时的混乱。"},{"id":"w:assist","lemma":"assist","pos":"v.","ipa":"/əˈsɪst/","zh":"协助；帮助","emoji":"","example":"Crew members assist passengers at the bottom of the slide.","exampleZh":"机组人员在滑梯底部协助旅客。"},{"id":"w:procedure","lemma":"procedure","pos":"n.","ipa":"/prəˈsiːdʒə/","zh":"程序；步骤","emoji":"","example":"Follow the evacuation procedure step by step.","exampleZh":"请一步一步遵循撤离程序。"},{"id":"w:ditch","lemma":"ditch","pos":"v.","ipa":"/dɪtʃ/","zh":"水上迫降","emoji":"","example":"The aircraft may ditch in the water.","exampleZh":"飞机可能要在水上迫降。"},{"id":"w:colleague","lemma":"colleague","pos":"n.","ipa":"/ˈkɒliːɡ/","zh":"同事","emoji":"","example":"Ask a colleague to check the cabin with you.","exampleZh":"请一位同事和你一起检查客舱。"},{"id":"w:handover","lemma":"handover","pos":"n.","ipa":"/ˈhændəʊvə/","zh":"交接","emoji":"","example":"The handover report covers every open item.","exampleZh":"交接报告涵盖每一项待办事项。"},{"id":"w:debrief","lemma":"debrief","pos":"v.","ipa":"/ˌdiːˈbriːf/","zh":"讲评；总结","emoji":"","example":"We will debrief the flight after landing.","exampleZh":"降落后我们会做航班讲评。"},{"id":"w:roster","lemma":"roster","pos":"n.","ipa":"/ˈrɒstə/","zh":"排班表；名单","emoji":"","example":"The new roster is on the crew board.","exampleZh":"新的排班表在机组公告板上。"},{"id":"w:shift","lemma":"shift","pos":"n.","ipa":"/ʃɪft/","zh":"班次；轮班","emoji":"","example":"My shift starts at five in the morning.","exampleZh":"我的班次早上五点开始。"},{"id":"w:report","lemma":"report","pos":"v.","ipa":"/rɪˈpɔːt/","zh":"报告；汇报","emoji":"","example":"Please report any problem to the senior crew.","exampleZh":"请向乘务长报告任何问题。"},{"id":"w:supervise","lemma":"supervise","pos":"v.","ipa":"/ˈsuːpəvaɪz/","zh":"监督；管理","emoji":"","example":"The purser will supervise the cabin service.","exampleZh":"乘务长将监督客舱服务。"},{"id":"w:coordinate","lemma":"coordinate","pos":"v.","ipa":"/kəʊˈɔːdɪneɪt/","zh":"协调","emoji":"","example":"We must coordinate with the ground staff.","exampleZh":"我们必须与地面工作人员协调。"},{"id":"w:communicate","lemma":"communicate","pos":"v.","ipa":"/kəˈmjuːnɪkeɪt/","zh":"沟通；交流","emoji":"","example":"Crew members communicate clearly during the service.","exampleZh":"机组人员在服务期间清楚地沟通。"},{"id":"w:teamwork","lemma":"teamwork","pos":"n.","ipa":"/ˈtiːmwɜːk/","zh":"团队合作","emoji":"","example":"Good teamwork keeps the cabin service smooth.","exampleZh":"良好的团队合作让客舱服务顺畅。"},{"id":"w:responsibility","lemma":"responsibility","pos":"n.","ipa":"/rɪˌspɒnsəˈbɪləti/","zh":"责任","emoji":"","example":"Safety is the responsibility of every crew member.","exampleZh":"安全是每位机组人员的责任。"},{"id":"w:punctual","lemma":"punctual","pos":"adj.","ipa":"/ˈpʌŋktʃuəl/","zh":"守时的；准时的","emoji":"","example":"Please be punctual for the crew briefing.","exampleZh":"请准时参加机组准备会。"},{"id":"w:professional","lemma":"professional","pos":"adj.","ipa":"/prəˈfeʃənəl/","zh":"专业的；职业的","emoji":"","example":"A professional crew stays calm under pressure.","exampleZh":"专业的机组在压力下保持冷静。"},{"id":"w:perform","lemma":"perform","pos":"v.","ipa":"/pəˈfɔːm/","zh":"执行；表演","emoji":"","example":"The crew will perform the safety demonstration.","exampleZh":"机组人员将进行安全演示。"},{"id":"w:checklist","lemma":"checklist","pos":"n.","ipa":"/ˈtʃeklɪst/","zh":"检查单；清单","emoji":"","example":"Use the checklist before you close the door.","exampleZh":"关舱门前请使用检查单。"},{"id":"w:notify","lemma":"notify","pos":"v.","ipa":"/ˈnəʊtɪfaɪ/","zh":"通知；告知","emoji":"","example":"Please notify the captain about the sick passenger.","exampleZh":"请通知机长有旅客生病。"},{"id":"w:confirm","lemma":"confirm","pos":"v.","ipa":"/kənˈfɜːm/","zh":"确认；核实","emoji":"","example":"Please confirm the seat number with the passenger.","exampleZh":"请与旅客确认座位号。"},{"id":"w:task","lemma":"task","pos":"n.","ipa":"/tɑːsk/","zh":"任务；工作","emoji":"","example":"Each crew member has a clear task.","exampleZh":"每位机组人员都有明确的任务。"},{"id":"w:preflight","lemma":"preflight","pos":"adj.","ipa":"/ˌpriːˈflaɪt/","zh":"飞行前的","emoji":"","example":"The preflight briefing starts at six.","exampleZh":"飞行前准备会六点开始。"},{"id":"w:allocate","lemma":"allocate","pos":"v.","ipa":"/ˈæləkeɪt/","zh":"分配；分派","emoji":"","example":"The purser will allocate seats to the crew.","exampleZh":"乘务长会给机组人员分配座位。"}]};</script>
